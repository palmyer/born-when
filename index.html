<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你出生时 · 人生可视化</title>
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/wheel.css">
<style>
  .ev { display: flex; gap: 10px; padding: 11px 18px; border-top: 0.5px solid var(--sep); font-size: 14px; }
  .ev:first-child { border-top: none; }
  .ev .dot2 { color: var(--accent); flex-shrink: 0; }
  .anchor-row { display: flex; justify-content: space-between; padding: 10px 18px; font-size: 14px; border-top: 0.5px solid var(--sep); }
  .anchor-row:first-child { border-top: none; }
  .anchor-row .r { color: var(--accent); font-weight: 600; text-align: right; }
</style>
</head>
<body>
<div class="wrap">
  <header class="tool-head">
    <a class="back" href="preview.html" target="_top">📱 手机预览版</a>
    <h1>你出生时</h1>
    <p class="sub">你出生那年，世界正在发生什么</p>
  </header>

  <section class="card" id="settingsCard"></section>
  <section class="card" id="resultCard"></section>
  <section class="card" id="eventsCard"></section>
  <section class="card" id="anchorCard"></section>

  <p class="hint" style="text-align:center">你和时代的关系，一组数字就能看清。</p>
</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="sheet-toolbar">
    <div class="sheet-title" id="sheetTitle">选择</div>
    <button class="done-btn" id="sheetDone">完成</button>
  </div>
  <div class="wheel-wrap">
    <div class="wheel-mask-top"></div>
    <div class="wheel-mask-bottom"></div>
    <div class="wheel-band"></div>
    <div class="wheel-row" id="wheelRow"></div>
  </div>
</div>

<script src="shared/core.js"></script>
<script src="shared/wheel.js"></script>
<script src="data/born-events.js"></script>
<script>
var state = { birthday: LGF.getBirthday() };

function render() {
  LGF.setBirthday(state.birthday);
  var birth = LGF.parseDate(state.birthday);
  var year = birth.getFullYear();
  var now = new Date();
  var days = LGF.daysBetween(birth, now);

  var events = BORN_EVENTS[year] || ['那一年的大事还没有录入——但你的出生就是家里的大事'];
  var noData = !BORN_EVENTS[year];

  document.getElementById('settingsCard').innerHTML =
    '<div class="row clickable" id="birthdayRow"><span class="label">生日</span>' +
      '<span class="value">' + state.birthday + '<span class="chevron">›</span></span></div>';

  document.getElementById('resultCard').innerHTML =
    '<div class="stat-cap">你出生于</div>' +
    '<div class="stat-big">' + year + ' 年</div>' +
    '<div class="stat-foot">距今已 ' + LGF.fmt(days) + ' 天 · 约 ' + LGF.fmt(Math.round(days / 365.25)) + ' 年</div>';

  document.getElementById('eventsCard').innerHTML =
    '<div class="card-title">' + year + ' 年 · 大事记</div>' +
    events.map(function (e) { return '<div class="ev"><span class="dot2">◆</span><span>' + e + '</span></div>'; }).join('') +
    (noData ? '<p class="hint" style="padding-top:12px">数据集覆盖 1950-2025 年</p>' : '');

  document.getElementById('anchorCard').innerHTML =
    '<div class="card-title">时代锚点</div>' +
    TIME_ANCHORS.map(function (a) {
      var d = year - a.year;
      var txt;
      if (d > 0) txt = '已过去 ' + d + ' 年';
      else if (d < 0) txt = '还要等 ' + (-d) + ' 年';
      else txt = '就是那一年！';
      return '<div class="anchor-row"><span>' + a.name + '</span><span class="r">' + txt + '</span></div>';
    }).join('');

  document.getElementById('birthdayRow').addEventListener('click', function () {
    WheelUI.openDate(state.birthday,
      function (v) { state.birthday = v; render(); },
      function (v) {
        var el = document.querySelector('#birthdayRow .value');
        if (el) el.innerHTML = v + '<span class="chevron">›</span>';
      }, render);
  });
}

WheelUI.init();
render();
</script>
</body>
</html>
